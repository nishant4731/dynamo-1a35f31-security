artifacts = ["/app/src/rootfs_apply.py"]

[task]
name = "dynamo/rootfs-delta-hardening"
description = "Harden a privileged rootfs delta applier against traversal, link, metadata, and race attacks."

[metadata]
category = "Security"
subcategory = "Security hardening"
model_tested = "GPT-5.4"
agent_tested = "Terminus-2"
task_objective = ["secure_or_harden", "fix"]
artifact_type = ["codebase", "security_artifact"]
expert_time_estimate_hours = 24
difficulty_explanation = "This is work for a Linux product-security engineer or OCI/update-system author hardening a privileged container-layer or OTA rootfs applier. It involves descriptor-relative path resolution, TOCTOU resistance, ordered stateful layer semantics, a closed initial hardlink graph, alias-visible metadata, fresh-inode replacement, exact metadata effects, rollback, and adversarial concurrency. A lexical path sanitizer or a single realpath check is insufficient: an in-root regular file or hardlinked symlink can alias an inode outside the root, so link-count reconciliation must compose with the transaction boundary. The starter and verifier-generated bundles are synthetic, but model realistic filesystem trees and attack patterns; unseen fixtures combine the rules in ways that defeat single-case patches."
solution_explanation = "The solver must derive and enforce a confinement invariant for every operation, audit the untrusted initial object graph, preserve the ordered bundle state machine, and separate safe staging from commit. A viable solution uses no-following component traversal or an equivalent private staging design, reconciles each regular inode's observed in-root aliases with st_nlink, rejects hardlinked symlinks plus special or set-ID initial entries, handles links and whiteouts without following attacker-controlled names, produces the exact final ownership/mode/xattr/mtime state, and commits only after the entire bundle succeeds. The fallback flag ensures the design is not dependent on one optional kernel fast path."
verification_explanation = "The verifier first integrity-pins the immutable public bundle and semantics document through no-follow regular-file descriptors. It then runs the submitted program on independently modeled valid bundles, deterministic multi-seed bundles, and deterministic submission-namespaced bundles whose expected outcomes are computed by the same independent model. A fixed domain-separated seed plus the no-follow digest of the submitted artifact makes identical submissions receive identical cohorts while varying namespaces across distinct submissions. The verifier compares the complete resulting tree, file bytes, object types, hardlink inode relationships, full special/permission modes (with only permission and sticky bits valid), uid/gid, exact user.* xattr maps, and mtime_ns for unchanged fixed-time initial paths or operation output paths with explicit mtime_ns; creation-time mtimes without an explicit value, atime, ctime, and otherwise unobservable metadata-call ordering are not graded. It checks terminal-symlink replacement plus non-zero unchanged-state rejection for malformed inputs, object-type collisions (including an existing hardlink destination), missing/non-directory parents, transactionally late failures, initial set-ID/special objects, externally aliased regular inodes, and hardlinked initial symlinks, as well as every path-bearing operation role through canary-targeted symlink parents in normal and forced-fallback modes. Initial-graph attacks require exact inside and populated outside-canary snapshots, including hardlink identity and no-follow symlink metadata. A deterministic 64-run concurrent path-swap harness permits zero outside-canary violations. Generated values change only valid names and metadata, never the acceptance rule, so correctness is reproducible while literal fixture dispatch cannot pass."

