artifacts = ["/app/src/rootfs_apply.py"]

[task]
name = "dynamo/rootfs-delta-hardening"
description = "Harden a privileged rootfs delta applier against traversal, link, metadata, and race attacks."

[metadata]
category = "Security"
subcategory = "Security hardening"
model_tested = "Opus-4.8"
agent_tested = "Terminus-2"
task_objective = ["secure_or_harden", "fix"]
artifact_type = ["codebase", "security_artifact"]
expert_time_estimate_hours = 24
difficulty_explanation = "This is work for a Linux product-security engineer or OCI/update-system author hardening a privileged container-layer or OTA rootfs applier. It involves descriptor-relative path resolution, TOCTOU resistance, ordered stateful layer semantics, hardlink identity, metadata ordering, rollback, and adversarial concurrency. A lexical path sanitizer or a single realpath check is insufficient. The starter and verifier-generated bundles are synthetic, but model realistic filesystem trees and attack patterns; unseen fixtures combine the rules in ways that defeat single-case patches."
solution_explanation = "The solver must derive and enforce a confinement invariant for every operation, preserve the ordered bundle state machine, and separate safe staging from commit. A viable solution uses no-following component traversal or an equivalent private staging design, handles links and whiteouts without following attacker-controlled names, applies ownership/mode/xattrs/mtime in the stated order, and commits only after the entire bundle succeeds. The fallback flag ensures the design is not dependent on one optional kernel fast path."
verification_explanation = "The verifier runs the submitted program on independently modeled valid bundles and fresh adversarial bundles. It compares the complete resulting tree, file bytes, object types, hardlink inode relationships, modes, uid/gid, mtime_ns, and user.* xattrs; it checks non-zero rejection and unchanged state for malformed or unsafe bundles; and it runs a deterministic 64-run concurrent path-swap harness with zero outside-canary violations required. Ground truth and hidden fixtures are injected only at verification time, and the prior visible fixture is insufficient because hidden cases permute names and combine semantics."

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
gpus = 0
